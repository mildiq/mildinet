services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mildinet_db
      POSTGRES_USER: mealdi
      POSTGRES_PASSWORD: mealdi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealdi -d mildinet_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mealdi-postgres:/var/lib/postgresql

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mealdi-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      MILDINET_DATABASE_URL: postgresql+asyncpg://mealdi:mealdi@postgres:5432/mildinet_db
      MILDINET_JWT_SECRET: ${MILDINET_JWT_SECRET:-development-only-change-this-secret}

      MILDINET_S3_ENDPOINT: ${MILDINET_S3_ENDPOINT}
      MILDINET_S3_ACCESS_KEY: ${MILDINET_S3_ACCESS_KEY}
      MILDINET_S3_SECRET_KEY: ${MILDINET_S3_SECRET_KEY}
      MILDINET_S3_BUCKET: ${MILDINET_S3_BUCKET}
    command: sh -c "alembic upgrade head && uvicorn bootstrap.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  mealdi-postgres:
  mealdi-minio: